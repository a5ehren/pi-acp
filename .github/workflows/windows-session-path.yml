name: Windows session path regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test test/unit/pi-rpc-session-path.test.ts test/unit/pi-command.test.ts
